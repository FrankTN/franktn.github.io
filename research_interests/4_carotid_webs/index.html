<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.0 Transitional//EN" "http://www.w3.org/TR/REC-html40/loose.dtd"> <html><body> <p>Carotid webs are shelf-like fibrous projections in the carotid artery that can disrupt blood flow and increase the risk of ischemic stroke. We are developing automated methods to detect these webs on CTA scans, aiming to improve early diagnosis and support clinical decision-making.</p> </body></html>
