<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.0 Transitional//EN" "http://www.w3.org/TR/REC-html40/loose.dtd"> <html><body> <p>With colleagues from the <a href="https://icai-stroke-lab.webflow.io/" rel="external nofollow noopener" target="_blank">ICAI Stroke Lab</a> we are investigating potential use-cases for synthetic tabular data for prediction modelling. Specifically, we aim to mitigate class imbalance by generating synthetic samples for minority classes, thereby improving predictive performance.</p> </body></html>
